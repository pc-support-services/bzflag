# Build smoke-checks for Windows and macOS.
# Linux is already covered by build-deb.yml — do not modify it.
name: build-check

on:
  push:
    branches: [2.4]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config sdl2 glew freeglut c-ares curl

      - name: Configure and build
        run: |
          export CPPFLAGS="-I$(brew --prefix)/include -I$(brew --prefix c-ares)/include"
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix c-ares)/lib"
          ./autogen.sh
          ./configure
          make -j2

  windows:
    runs-on: windows-latest
    continue-on-error: false
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: false
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-c-ares
            mingw-w64-x86_64-libgnurx
            mingw-w64-x86_64-curl

      - name: Configure and build (autotools, best-effort)
        run: |
          ln -sf /mingw64/lib/libgnurx.a /mingw64/lib/libregex.a
          export LIBS="-lregex"
          ./autogen.sh
          ./configure
          make -j2
# Build smoke-checks for Windows and macOS.
# Linux is already covered by build-deb.yml — do not modify it.
name: build-check

on:
  push:
    branches: [2.4]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config sdl2 glew glu

      - name: Configure and build
        run: |
          ./autogen.sh
          ./configure
          make -j2

  windows:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: false
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-glu
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-c-ares

      - name: Configure and build (autotools, best-effort)
        run: |
          ./autogen.sh
          ./configure
          make -j2
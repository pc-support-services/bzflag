# Build smoke-checks for Windows and macOS.
# Linux is already covered by build-deb.yml — do not modify it.
name: build-check

on:
  push:
    branches: [2.4]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config sdl2 sdl3 glew freeglut c-ares curl

      - name: Configure and build
        run: |
          export CPPFLAGS="-I$(brew --prefix)/include -I$(brew --prefix c-ares)/include"
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix c-ares)/lib"
          ./autogen.sh
          ./configure
          make -j2

      - name: Stage install tree
        run: |
          make install DESTDIR="$PWD/pkg"

      - name: Assemble BZFlag.app
        run: |
          set -eux
          APP="$PWD/dist/BZFlag.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp pkg/usr/local/bin/bzflag "$APP/Contents/MacOS/bzflag"
          cp -R pkg/usr/local/share/bzflag "$APP/Contents/Resources/bzflag"
          # Bundle dylib deps and rewrite load commands. Without this the
          # binary keeps absolute /opt/homebrew/... references that only
          # exist on the CI runner and dyld refuses to launch anywhere else.
          EXE="$APP/Contents/MacOS/bzflag"
          FW="$APP/Contents/Frameworks"
          copy_deps() {
            local bin="$1"
            otool -L "$bin" | awk 'NR>1 {print $1}' | while read -r dep; do
              case "$dep" in
                @executable_path/*|@rpath/*|/System/*|/usr/lib/*) continue ;;
              esac
              local name base
              name="$(basename "$dep")"
              [ -e "$FW/$name" ] || { cp -L "$dep" "$FW/$name"; }
              install_name_tool -change "$dep" "@executable_path/../Frameworks/$name" "$bin"
            done
          }
          rewrite_one() {
            # bundle any non-system deps of a bundled dylib and rewrite
            # them to @rpath — run repeatedly until nothing changes
            # (brew chains go deeper than one level: sdl3->brotli etc.)
            local lib="$1"
            otool -L "$lib" | awk 'NR>1 {print $1}' | grep '^/opt/homebrew\|^/usr/local\|^/Users/' | while read -r dep; do
              local name; name="$(basename "$dep")"
              [ -e "$FW/$name" ] || cp -L "$dep" "$FW/$name"
              install_name_tool -change "$dep" "@rpath/$name" "$lib"
            done
          }
          copy_deps "$EXE"
          # transitive closure: keep rewriting/bundling until a fixed point
          for _ in 1 2 3 4 5 6; do
            changed=0
            for lib in "$FW"/*.dylib; do
              [ -e "$lib" ] || continue
              before=$(otool -L "$lib" | awk 'NR>1 {print $1}' | grep -c '^/opt/homebrew\|^/usr/local\|^/Users/' || true)
              [ "$before" -gt 0 ] || continue
              rewrite_one "$lib"
              after=$(otool -L "$lib" | awk 'NR>1 {print $1}' | grep -c '^/opt/homebrew\|^/usr/local\|^/Users/' || true)
              [ "$before" != "$after" ] && changed=1
            done
            [ "$changed" -eq 1 ] || break
          done
          for lib in "$FW"/*.dylib; do
            [ -e "$lib" ] || continue
            # rewrite the dylib's own install ID (LC_ID_DYLIB) away from
            # the brew path — the gate treats any remaining /opt/... or
            # /usr/local reference as a failure, ID included
            id=$(otool -D "$lib" | awk 'NR==2 {print $1}')
            case "$id" in
              ""|@rpath/*|@executable_path/*) ;;
              *) install_name_tool -id "@rpath/$(basename "$id")" "$lib" 2>/dev/null || true ;;
            esac
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$lib" 2>/dev/null || true
          done
          # brew sdl2 = sdl2-compat SHIM: it dlopens libSDL3.dylib at
          # runtime (search order @loader_path, @executable_path, plain
          # name). Without SDL3 next to it the app dies with "Fatal error!
          # Cannot continue! Failed loading SDL3 library." on any Mac
          # without brew's sdl3 installed. Bundle it explicitly, then let
          # the closure loops below rewrite its load commands like the
          # other bundled dylibs (its own ID references libSDL3.0.dylib
          # via an @rpath-free brew path).
          SDL3SRC="$(brew --prefix sdl3 2>/dev/null)/lib/libSDL3.dylib"
          if [ -f "$SDL3SRC" ]; then
            cp -L "$SDL3SRC" "$FW/libSDL3.dylib"
          else
            SDL3FND="$(find "$(brew --prefix)/opt" -maxdepth 3 -name 'libSDL3*.dylib' 2>/dev/null | head -1)"
            if [ -z "$SDL3FND" ]; then
              echo "brew sdl3 dylib candidates:"; ls "$(brew --prefix)/opt/sdl3/lib" 2>/dev/null || true
              fail "libSDL3.dylib not found in brew sdl3"
            fi
            cp -L "$SDL3FND" "$FW/libSDL3.dylib"
          fi
          # rewrite the copied lib's load commands and ID right here:
          # the SDL3 dylib's ID is /opt/homebrew/opt/sdl3/lib/
          # libSDL3.0.dylib (brew stows the versioned name as the ID);
          # rewrite ID + deps to @rpath before any gate can see them.
          SDL3LIB="$FW/libSDL3.dylib"
          while read -r dep; do
            case "$dep" in
              @executable_path/*|@rpath/*|/System/*|/usr/lib/*) continue ;;
            esac
            name="$(basename "$dep")"
            [ -e "$FW/$name" ] || cp -L "$dep" "$FW/$name"
            install_name_tool -change "$dep" "@rpath/$name" "$SDL3LIB"
          done < <(otool -L "$SDL3LIB" | awk 'NR>1 {print $1}' | grep '^/opt/homebrew\|^/usr/local\|^/Users/')
          id=$(otool -D "$SDL3LIB" | awk 'NR==2 {print $1}')
          case "$id" in
            ""|@rpath/*|@executable_path/*) ;;
            *) install_name_tool -id "@rpath/$(basename "$id")" "$SDL3LIB" ;;
          esac
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$SDL3LIB" 2>/dev/null || true
          find "$APP/Contents/Resources/bzflag" -type f -perm -111 -name '*.so' | while read -r plugin; do
            otool -L "$plugin" | awk 'NR>1 {print $1}' | while read -r dep; do
              case "$dep" in
                @executable_path/*|@rpath/*|/System/*|/usr/lib/*) continue ;;
              esac
              name="$(basename "$dep")"
              if [ -e "$FW/$name" ]; then
                install_name_tool -change "$dep" "@executable_path/../Frameworks/$name" "$plugin"
              fi
            done
          done
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>BZFlag</string>
            <key>CFBundleExecutable</key><string>bzflag</string>
            <key>CFBundleIdentifier</key><string>org.bzflag.bzflag</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>2.4</string>
            <key>CFBundleShortVersionString</key><string>2.4</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>BZFlag connects to game servers on your local network.</string>
            <key>NSBonjourServices</key>
            <array>
              <string>_bzflag._tcp</string>
              <string>_bzflag._udp</string>
            </array>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP" || true

      - name: Verify app bundle
        # Gate: the dmg must not leave CI still pointing at /opt/homebrew,
        # and the app must find its data/fonts inside the bundle (clean
        # Mac has no /usr/local/share/bzflag).
        run: |
          set -e
          fail() { echo "BUNDLE CHECK FAILED: $1"; exit 1; }
          EXE="dist/BZFlag.app/Contents/MacOS/bzflag"
          [ -f "$EXE" ] || fail "bzflag binary missing from app bundle"
          # every non-system load command must now be in-bundle — for the
          # exe AND every bundled dylib/plugin, not just the top-level exe
          BAD=0
          for bin in "$EXE" dist/BZFlag.app/Contents/Frameworks/*.dylib \
                     $(find dist/BZFlag.app/Contents/Resources -type f -perm -111 -name '*.so'); do
            [ -e "$bin" ] || continue
            N=$(otool -L "$bin" | awk 'NR>1 {print $1}' | grep -c '^/opt/homebrew\|^/usr/local\|^/Users/' || true)
            if [ "$N" -gt 0 ]; then
              echo "OFFENDER $bin:"
              otool -L "$bin" | awk 'NR>1 {print $1}' | grep '^/opt/homebrew\|^/usr/local\|^/Users/' || true
            fi
            BAD=$((BAD + N))
          done
          [ "$BAD" -eq 0 ] || fail "$BAD load commands still reference runner paths"
          FW="dist/BZFlag.app/Contents/Frameworks"
          [ -f "$FW/libSDL2-2.0.0.dylib" ] || [ -f "$FW/libSDL2.dylib" ] || fail "SDL2 dylib not bundled"
          # sdl2-compat dlopens libSDL3.dylib next to itself (search starts
          # at @loader_path) — missing it is a fatal-at-launch bug on any
          # clean Mac, and a load-command scan canNOT see it
          [ -f "$FW/libSDL3.dylib" ] || fail "libSDL3.dylib not bundled (sdl2-compat dlopens it at runtime)"
          [ -e "$FW/libGLEW" ] || ls "$FW"/libGLEW* >/dev/null 2>&1 || fail "GLEW dylib not bundled"
          otool -l "$EXE" | grep -q "LC_LOAD_DYLIB" || fail "no load commands found"
          # data/fonts must resolve INSIDE the bundle: the client now
          # probes Contents/Resources/<data> at startup (bzflag.cxx
          # __APPLE__ branch); CI stages share/bzflag -> Resources/bzflag
          for d in dist/BZFlag.app/Contents/Resources/bzflag dist/BZFlag.app/Contents/Resources/data; do
            if [ -d "$d" ]; then
              [ -d "$d/l10n" ] || [ -d "$d/fonts" ] || fail "$d lacks l10n/fonts"
              echo "data dir in bundle: $d"
              FOUND=1
            fi
          done
          [ "${FOUND:-0}" -eq 1 ] || fail "no data dir staged inside Resources (client will exit 'No fonts found' on a clean Mac)"
          [ -n "$(find dist/BZFlag.app/Contents/Resources -name '*.png' -path '*fonts*' -print -quit)" ] || fail "font PNGs missing from bundle Resources"
          ls -la "$FW"
          echo "bundle check OK: no runner-path load commands remain"

      - name: Build DMG
        run: |
          hdiutil detach "/Volumes/BZFlag" -force || true
          hdiutil create -volname BZFlag -srcfolder "$PWD/dist/BZFlag.app" -ov -format UDZO bzflag-macos.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: bzflag-macos-dmg
          path: bzflag-macos.dmg
          if-no-files-found: error

      - name: Attach DMG to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bzflag-macos.dmg

  windows:
    runs-on: windows-latest
    continue-on-error: false
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force LF checkout
        shell: bash
        run: |
          git config core.autocrlf false
          git rm -r -q --cached .
          git reset --hard

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          # refresh the package DB: the cached base image can lag behind
          # the repo
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkg-config
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-c-ares
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-nsis

      - name: Install libgnurx from repo archive
        # libgnurx was dropped from the mingw64 pacman DB (configure.ac
        # needs a regcomp provider when libc lacks one); the package file
        # is still served from the archive, so install it manually
        shell: msys2 {0}
        run: |
          set -e
          curl -fsSL -o /tmp/libgnurx.pkg.tar.zst \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-libgnurx-2.5.1-3-any.pkg.tar.zst
          # msys2's tar cannot autodetect zstd here; decompress explicitly
          zstd -d -f -o /tmp/libgnurx.pkg.tar /tmp/libgnurx.pkg.tar.zst
          tar -xf /tmp/libgnurx.pkg.tar -C /

      - name: Configure and build
        run: |
          ln -sf /mingw64/lib/libgnurx.a /mingw64/lib/libregex.a
          export LIBS="-lregex"
          export CXXFLAGS="-fpermissive"
          # forced-include shim: F_GETFL/F_SETFL used before their defines in
          # _WIN32 blocks of ServerQueryPlayers/ServerMapPreview; poll() lacks a
          # lowercase name on mingw (ws2tcpip.h gives struct pollfd + WSAPoll).
          cat > /tmp/bzwinshim.h <<'EOF'
          #ifdef _WIN32
          #  ifndef F_GETFL
          #    define F_GETFL 0
          #  endif
          #  ifndef F_SETFL
          #    define F_SETFL 4
          #  endif
          #  ifndef poll
          #    define poll WSAPoll
          #  endif
          #endif
          EOF
          export CXXFLAGS="-fpermissive -include /tmp/bzwinshim.h"
          # posix net-header shims for mingw (winsock2 backend); CPATH wins over system dirs
          mkdir -p /tmp/bzinc/sys /tmp/bzinc/netinet /tmp/bzinc/arpa
          cat > /tmp/bzinc/sys/socket.h <<'EOF'
          #ifndef BZ_SHIM_SYS_SOCKET_H
          #define BZ_SHIM_SYS_SOCKET_H
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #endif
          EOF
          cat > /tmp/bzinc/netinet/in.h <<'EOF'
          #ifndef BZ_SHIM_NETINET_IN_H
          #define BZ_SHIM_NETINET_IN_H
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #endif
          EOF
          cat > /tmp/bzinc/arpa/inet.h <<'EOF'
          #ifndef BZ_SHIM_ARPA_INET_H
          #define BZ_SHIM_ARPA_INET_H
          #include <winsock2.h>
          #endif
          EOF
          cat > /tmp/bzinc/netdb.h <<'EOF'
          #ifndef BZ_SHIM_NETDB_H
          #define BZ_SHIM_NETDB_H
          #include <winsock2.h>
          #endif
          EOF
          cat > /tmp/bzinc/poll.h <<'EOF'
          #ifndef BZ_SHIM_POLL_H
          #define BZ_SHIM_POLL_H
          #include <winsock2.h>
          struct pollfd { SOCKET fd; short events; short revents; };
          #ifndef POLLWRNORM
          #define POLLWRNORM 0x0010
          #endif
          #ifndef POLLRDNORM
          #define POLLRDNORM 0x0100
          #endif
          #ifndef POLLOUT
          #define POLLOUT POLLWRNORM
          #endif
          #ifndef POLLIN
          #define POLLIN POLLRDNORM
          #endif
          static inline int poll(struct pollfd* f, unsigned long n, int t)
          {
              return WSAPoll(f, n, t);
          }
          #endif
          EOF
          export CPATH="/tmp/bzinc${CPATH:+:$CPATH}"
          ./autogen.sh
          ./configure --disable-plugins
          make -j2

      - name: Collect binaries and DLLs
        run: |
          set -eux
          # Flat layout: exes + data/ side by side. The client resolves its
          # data dir as <exe_dir>\data (src/bzflag/bzflag.cxx Win32 branch),
          # so data MUST live next to bzflag.exe.
          mkdir -p pkg
          # libtool on mingw wraps the client in a stub that execs
          # <dir>/.libs/<exe>; shipping the wrapper ships a 60KB
          # "temporary wrapper script" binary instead of the game. Always
          # prefer the .libs binary.
          collect() {
            exe="$1"
            real="$exe"
            dir="$(dirname "$exe")"
            if [ -f "$dir/.libs/$(basename "$exe")" ]; then
              real="$dir/.libs/$(basename "$exe")"
            fi
            echo "collect $exe -> $real"
            cp "$real" pkg/
            ldd "$real" | awk '$3 ~ /^\/mingw64\// {print $3}' | sort -u | while read -r dll; do
              cp -n "$dll" pkg/
            done
          }
          collect src/bzflag/bzflag.exe
          collect src/bzfs/bzfs.exe
          collect src/bzadmin/bzadmin.exe
          cp -R data pkg/data
          find pkg -type d -name '.deps' -exec rm -rf {} + || true
          ls -la pkg

      - name: Verify package contents
        # Gate, don't trust: a broken tree must fail the job before the
        # artifacts hit the release.
        run: |
          set -e
          fail() { echo "PACKAGE CHECK FAILED: $1"; exit 1; }
          # NOTE: default GH shell for this step is msys2 with pipefail ON:
          # a `cmd | grep -qi pattern` that finds NOTHING exits 1 and, under
          # pipefail, aborts the whole script silently (`set -e`). So the
          # negative check must NOT be a bare pipeline in a && list — use
          # `! grep` on a command substitution's captured output instead.
          # all three exes must exist, be real binaries (not libtool
          # wrappers) and x64 (PE32+), and have their full DLL set staged
          for exe in bzflag.exe bzfs.exe bzadmin.exe; do
            [ -f "pkg/$exe" ] || fail "pkg/$exe missing"
            [ "$(stat -c%s "pkg/$exe")" -gt 500000 ] || fail "$exe too small - libtool wrapper shipped?"
            if strings "pkg/$exe" | grep -qi "temporary wrapper"; then fail "libtool wrapper shipped as $exe"; fi
            file "pkg/$exe" | grep -q "PE32+" || fail "$exe is not PE32+ (x64) as claimed"
          done
          # every non-system DLL the exes import must be INSIDE pkg/
          # (no pipeline loops: pipefail + set -e makes them abort
          # silently; collect the imports into a file, then loop plainly)
          ldd pkg/bzflag.exe pkg/bzfs.exe pkg/bzadmin.exe \
            | awk '{print $3}' | grep '^/mingw64/' | sort -u > /tmp/imports.txt || true
          MISSING=""
          while read -r dll; do
            [ -n "$dll" ] || continue
            name="$(basename "$dll")"
            [ -f "pkg/$name" ] || MISSING="$MISSING $name"
          done < /tmp/imports.txt
          [ -z "$MISSING" ] || fail "imported DLL(s) missing from pkg/:$MISSING"
          ldd pkg/bzflag.exe | grep -i "SDL2.dll" || fail "bzflag.exe not linked against SDL2.dll"
          ldd pkg/bzflag.exe | grep -i "glew32.dll" || fail "bzflag.exe not linked against glew32.dll"
          [ -f pkg/data/fonts/DejaVuSansCondensedBold_16.png ] || fail "data/fonts missing next to exe"
          ls -la pkg

      - name: Zip portable package
        run: |
          (cd pkg && zip -qr ../bzflag-windows-x64.zip .)

      - name: Build NSIS installer
        # Uses the committed package/win32/nsis/BZFlag.nsi (rewritten
        # 2026-10 for the flat pkg\ layout). BUILD_64 is defined because
        # the mingw64 toolchain produces x64 binaries. Failing makensis
        # must fail the job — no continue-on-error here.
        run: |
          cp package/win32/nsis/BZFlag.nsi .
          cp package/win32/nsis/side.bmp package/win32/nsis/header.bmp package/win32/nsis/uninstall.ico package/win32/nsis/copying.rtf .
          makensis -DBUILD_64 BZFlag.nsi

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: bzflag-windows-exe
          path: |
            bzflag-windows-x64.zip
            bzflag-windows-x64-setup.exe
          if-no-files-found: error

      - name: Attach Windows packages to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bzflag-windows-x64.zip
            bzflag-windows-x64-setup.exe
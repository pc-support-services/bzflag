# Build smoke-checks for Windows and macOS.
# Linux is already covered by build-deb.yml — do not modify it.
name: build-check

on:
  push:
    branches: [2.4]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config sdl2 glew freeglut c-ares curl

      - name: Configure and build
        run: |
          export CPPFLAGS="-I$(brew --prefix)/include -I$(brew --prefix c-ares)/include"
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix c-ares)/lib"
          ./autogen.sh
          ./configure
          make -j2

      - name: Stage install tree
        run: |
          make install DESTDIR="$PWD/pkg"

      - name: Assemble BZFlag.app
        run: |
          set -eux
          APP="$PWD/dist/BZFlag.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp pkg/usr/local/bin/bzflag "$APP/Contents/MacOS/bzflag"
          cp -R pkg/usr/local/share/bzflag "$APP/Contents/Resources/bzflag"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>BZFlag</string>
            <key>CFBundleExecutable</key><string>bzflag</string>
            <key>CFBundleIdentifier</key><string>org.bzflag.bzflag</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>2.4</string>
            <key>CFBundleShortVersionString</key><string>2.4</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP" || true

      - name: Build DMG
        run: |
          hdiutil detach "/Volumes/BZFlag" -force || true
          hdiutil create -volname BZFlag -srcfolder "$PWD/dist/BZFlag.app" -ov -format UDZO bzflag-macos.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: bzflag-macos-dmg
          path: bzflag-macos.dmg

  windows:
    runs-on: windows-latest
    continue-on-error: false
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force LF checkout
        shell: bash
        run: |
          git config core.autocrlf false
          git rm -r -q --cached .
          git reset --hard

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: false
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkg-config
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-c-ares
            mingw-w64-x86_64-libgnurx
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-nsis

      - name: Configure and build
        run: |
          ln -sf /mingw64/lib/libgnurx.a /mingw64/lib/libregex.a
          export LIBS="-lregex"
          ./autogen.sh
          ./configure --disable-plugins
          make -j2

      - name: Collect binaries and DLLs
        run: |
          set -eux
          mkdir -p pkg/bin
          for exe in src/bzflag/bzflag.exe src/bzfs/bzfs.exe src/bzadmin/bzadmin.exe; do
            cp "$exe" pkg/bin/
            ldd "$exe" | awk '$3 ~ /^\/mingw64\// {print $3}' | sort -u | while read -r dll; do
              cp -n "$dll" pkg/bin/
            done
          done
          mkdir -p pkg/share/bzflag
          cp -R data pkg/share/bzflag/ 2>/dev/null || true
          find pkg -type d -name '.deps' -exec rm -rf {} + || true

      - name: Zip portable package
        run: |
          (cd pkg && zip -qr ../bzflag-windows-x64.zip .)

      - name: Build NSIS installer
        continue-on-error: true
        run: |
          cat > bzflag.nsi <<'NSI'
          Name "BZFlag"
          OutFile "bzflag-windows-x64-setup.exe"
          InstallDir "$PROGRAMFILES64\BZFlag"
          Page directory
          Page instfiles
          Section
            SetOutPath "$INSTDIR"
            File /r pkg\*.*
          SectionEnd
          NSI
          makensis bzflag.nsi

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: bzflag-windows-exe
          path: |
            bzflag-windows-x64.zip
            bzflag-windows-x64-setup.exe
          if-no-files-found: error
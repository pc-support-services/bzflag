name: Build deb package

on:
  push:
    branches: [2.4]
    tags: ['v*']
  pull_request:
    branches: [2.4]
  workflow_dispatch:

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool autotools-dev \
            g++ make \
            libc-ares-dev libcurl4-openssl-dev \
            libsdl2-dev libglew-dev libglu1-mesa-dev libgl1-mesa-dev \
            libncurses5-dev libasound2-dev libpulse-dev \
            zlib1g-dev \
            fakeroot dpkg-dev

      - name: Autoreconf
        run: ./autogen.sh

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j"$(nproc)"

      - name: Stage install
        run: |
          make install-strip DESTDIR="$PWD/stage"

      - name: Build deb package
        run: |
          set -e
          VERSION="2.4.31-${GITHUB_RUN_NUMBER}"
          PKGDIR="$PWD/bzflag-deb"
          mkdir -p "$PKGDIR/DEBIAN"
          mkdir -p "$PKGDIR/usr/local"
          cp -a "$PWD/stage/usr/local"/* "$PKGDIR/usr/local/"

          # Ubuntu 24.04 (noble, the runner's own release) did the time_t
          # transition: libcurl4/libasound2 were rebuilt as
          # libcurl4t64/libasound2t64 (old names have no candidate on
          # noble). pulseaudio was NOT rebuilt for the transition:
          # libpulse0 is still the real noble package and libpulse0t64
          # does not exist there (verified against the noble Packages
          # index), so this one keeps the pre-t64 name.
          cat > "$PKGDIR/DEBIAN/control" << EOF
          Package: bzflag
          Version: ${VERSION}
          Architecture: ${{ matrix.arch }}
          Maintainer: ${GITHUB_ACTOR} <${GITHUB_ACTOR}@users.noreply.github.com>
          Depends: libc6, libstdc++6, libcurl4t64, libsdl2-2.0-0, libglew2.2, libglu1-mesa | libglu1, libgl1, libncurses6, libasound2t64, libpulse0, libcares2, zlib1g
          Section: games
          Priority: optional
          Description: 3D multiplayer tank battle game
           BZFlag is a free multiplayer 3D tank battle game. Players drive tanks
           around a battlefield, trying to capture flags from opposing teams while
           defending their own.
           .
           This package contains the client (bzflag), server (bzfs), and
           console admin tool (bzadmin).
          Homepage: https://www.bzflag.org/
          EOF

          # desktop file, icons, postinst/postrm from the template
          if [ -d package/bzflag-deb/usr ]; then
            cp -a package/bzflag-deb/usr/* "$PKGDIR/usr/" 2>/dev/null || true
          fi
          if [ -f package/bzflag-deb/DEBIAN/postinst ]; then
            cp package/bzflag-deb/DEBIAN/postinst "$PKGDIR/DEBIAN/"
          fi
          if [ -f package/bzflag-deb/DEBIAN/postrm ]; then
            cp package/bzflag-deb/DEBIAN/postrm "$PKGDIR/DEBIAN/"
          fi

          chmod 755 "$PKGDIR/DEBIAN"
          find "$PKGDIR" -type d -exec chmod 755 {} +

          # md5sums must contain paths relative to the package root, so
          # run find+md5sum from inside $PKGDIR.
          ( cd "$PKGDIR" && \
            find . -type f ! -path './DEBIAN/*' -printf '%P\0' \
            | xargs -0 md5sum > DEBIAN/md5sums )

          fakeroot dpkg-deb --build --root-owner-group "$PKGDIR" \
            "$PWD/bzflag_${VERSION}_${{ matrix.arch }}.deb"

      - name: Verify deb
        run: |
          ls -la bzflag_*.deb
          dpkg-deb -I bzflag_*.deb | head -20

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: bzflag-deb-${{ matrix.arch }}
          path: bzflag_*.deb
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bzflag_*_*.deb
          generate_release_notes: true